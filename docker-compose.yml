# Deployment shape matches the rest of the homelab: a container on Proxmox,
# exposed over Tailscale with `tailscale serve`. There is no auth here on
# purpose — reachability is a Tailscale ACL concern (see CLAUDE.md non-goals).
#
# Secrets come from a gitignored .env next to this file:
#   PROXMOX_TOKEN_ID=dashboard@pve!readonly
#   PROXMOX_TOKEN_SECRET=...

services:
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    # Bound to the Tailscale interface in practice; published here for the LAN.
    ports:
      - "8881:8881"
    volumes:
      - dashboard-data:/data
    environment:
      TZ: America/Chicago

      # --- upstreams ---
      # G.A.B.'s read-only assignments endpoint. Same always-on server.
      GAB_URL: "http://gab:8882"
      # The GPU agent runs on the main PC (RTX 5070 Ti), which is where the
      # LLM lives. This dashboard runs on the always-on server, so this is a
      # Tailscale address across two machines and the one upstream expected
      # to be offline whenever the main PC is.
      GPU_AGENT_URL: "http://workstation:8883"
      PROXMOX_URL: "https://pve:8006"
      PROXMOX_NODE: "pve"
      PROXMOX_TOKEN_ID: "${PROXMOX_TOKEN_ID}"
      PROXMOX_TOKEN_SECRET: "${PROXMOX_TOKEN_SECRET}"

      # --- attention thresholds (all confirmed) ---
      # Defaults in internal/config already match; set here so they are visible
      # at deploy time. Add to the container list as the homelab grows — it is
      # an env var precisely so that is not a rebuild.
      ATTENTION_CONTAINERS: "ollama,searxng,open-webui,ntfy,gab"
      ATTENTION_GPU_TEMP_C: "80"
      ATTENTION_DISK_PCT: "85"

volumes:
  dashboard-data:
