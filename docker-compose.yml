# Deployment shape matches the rest of the homelab: a container on Proxmox,
# exposed over Tailscale with `tailscale serve`. There is no auth here on
# purpose — reachability is a Tailscale ACL concern (see CLAUDE.md non-goals).
#
# THIS FILE STARTS THE DASHBOARD ONLY. G.A.B. is a separate project with its
# own repo, and it is not containerized: it needs the microphone, the speakers
# and Ollama, so it runs on the host as a systemd USER service (see
# gab.service.example over there). `docker compose up` therefore gives you a
# panel with the G.A.B. lane down until G.A.B. is started separately.
#
# Secrets come from a gitignored .env next to this file:
#   PROXMOX_TOKEN_ID=dashboard@pve!readonly
#   PROXMOX_TOKEN_SECRET=...

services:
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    # Bound to the Tailscale interface in practice; published here for the LAN.
    ports:
      - "8881:8881"
    volumes:
      - dashboard-data:/data
    extra_hosts:
      # G.A.B. runs on the HOST, not as a container on this network (see the
      # note at the top). From inside here 127.0.0.1 is this container, so the
      # host needs a name to be reachable at all; host-gateway is Docker's
      # built-in for exactly that, on Linux as well as Docker Desktop.
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Chicago

      # --- upstreams ---
      # G.A.B.'s read-only endpoints, on the same always-on server — but on
      # the host side of the container boundary, hence host.docker.internal
      # rather than a service name. This used to say "http://gab:8882", which
      # nothing on this network resolves: no `gab` service is defined here and
      # none can be, so the lane read UNREACHABLE no matter what G.A.B. was
      # doing. If G.A.B. ever moves to its own box, put its Tailscale name
      # here instead.
      GAB_URL: "http://host.docker.internal:8882"
      # The GPU agent runs on the main PC (RTX 5070 Ti), which is where the
      # LLM lives. This dashboard runs on the always-on server, so this is a
      # Tailscale address across two machines and the one upstream expected
      # to be offline whenever the main PC is.
      GPU_AGENT_URL: "http://workstation:8883"
      PROXMOX_URL: "https://pve:8006"
      PROXMOX_NODE: "pve"
      PROXMOX_TOKEN_ID: "${PROXMOX_TOKEN_ID}"
      PROXMOX_TOKEN_SECRET: "${PROXMOX_TOKEN_SECRET}"

      # --- attention thresholds (all confirmed) ---
      # Defaults in internal/config already match; set here so they are visible
      # at deploy time. Add to the container list as the homelab grows — it is
      # an env var precisely so that is not a rebuild.
      ATTENTION_CONTAINERS: "ollama,searxng,open-webui,ntfy,gab"
      ATTENTION_GPU_TEMP_C: "80"
      ATTENTION_DISK_PCT: "85"

volumes:
  dashboard-data:
